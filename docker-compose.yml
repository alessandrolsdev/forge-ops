services:
  proxy:
    build:
      context: .
      dockerfile: traefik/Dockerfile
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /opt/forgeops-traefik/entrypoint.sh
    environment:
      TRAEFIK_DOCKER_PROVIDER_ENABLED: ${TRAEFIK_DOCKER_PROVIDER_ENABLED:-false}
      TRAEFIK_DOCKER_PROVIDER_ENDPOINT: ${TRAEFIK_DOCKER_PROVIDER_ENDPOINT:-unix:///var/run/docker.sock}
      TRAEFIK_DOCKER_PROVIDER_NETWORK: ${TRAEFIK_DOCKER_PROVIDER_NETWORK:-forgeops}
      TRAEFIK_PROVIDER_OBSERVER_INTERVAL_SECONDS: ${TRAEFIK_PROVIDER_OBSERVER_INTERVAL_SECONDS:-30}
    ports:
      - '${FORGEOPS_PROXY_PORT:-80}:80'
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/scripts:/opt/forgeops-traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - /bin/sh /opt/forgeops-traefik/healthcheck.sh
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - forgeops

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      FORGEOPS_PROXY_PORT: ${FORGEOPS_PROXY_PORT:-80}
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    expose:
      - '3000'
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - frontend_node_modules:/workspace/frontend/node_modules
    labels:
      - 'traefik.enable=${TRAEFIK_DOCKER_PROVIDER_ENABLED:-false}'
      - 'traefik.docker.network=${TRAEFIK_DOCKER_PROVIDER_NETWORK:-forgeops}'
      - 'traefik.http.routers.forgeops-frontend-docker.rule=Host(`docker-frontend.forgeops.local`)'
      - 'traefik.http.routers.forgeops-frontend-docker.entrypoints=web'
      - 'traefik.http.routers.forgeops-frontend-docker.service=forgeops-frontend-docker'
      - 'traefik.http.services.forgeops-frontend-docker.loadbalancer.server.port=3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3000'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - forgeops

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://forgeops:forgeops@postgres:5432/forgeops
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: 'true'
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      OPERATOR_AUTH_ENABLED: ${OPERATOR_AUTH_ENABLED:-}
      OPERATOR_AUTH_ISSUER: ${OPERATOR_AUTH_ISSUER:-}
      OPERATOR_AUTH_AUDIENCE: ${OPERATOR_AUTH_AUDIENCE:-}
      OPERATOR_AUTH_MODE: ${OPERATOR_AUTH_MODE:-}
      OPERATOR_AUTH_JWKS_URL: ${OPERATOR_AUTH_JWKS_URL:-}
      OPERATOR_AUTH_SHARED_SECRET: ${OPERATOR_AUTH_SHARED_SECRET:-}
    expose:
      - '3333'
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/backend/node_modules
    labels:
      - 'traefik.enable=${TRAEFIK_DOCKER_PROVIDER_ENABLED:-false}'
      - 'traefik.docker.network=${TRAEFIK_DOCKER_PROVIDER_NETWORK:-forgeops}'
      - 'traefik.http.routers.forgeops-backend-docker.rule=Host(`docker-api.forgeops.local`)'
      - 'traefik.http.routers.forgeops-backend-docker.entrypoints=web'
      - 'traefik.http.routers.forgeops-backend-docker.service=forgeops-backend-docker'
      - 'traefik.http.services.forgeops-backend-docker.loadbalancer.server.port=3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:3333/api/v1/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - forgeops

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgeops
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: forgeops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgeops -d forgeops']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgeops

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgeops

networks:
  forgeops:
    name: forgeops

volumes:
  postgres_data:
  redis_data:
  workspace_node_modules:
  frontend_node_modules:
  backend_node_modules:
