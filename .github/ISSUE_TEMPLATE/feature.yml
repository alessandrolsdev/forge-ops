name: Feature
description: Request an increment of product or platform behavior.
title: '[feat] '
labels:
  - feat
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this issue deliver and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the technical scope, boundaries, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Use checkboxes or short assertions.
      value: |
        - [ ] Happy path validated
        - [ ] Expected failures handled
        - [ ] Tests updated
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking or blocked issues when applicable.

