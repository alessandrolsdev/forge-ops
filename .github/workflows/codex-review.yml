name: Codex Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: codex-review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip fork pull requests
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          echo "Codex review is skipped for fork pull requests to avoid exposing review automation to untrusted contexts."

      - name: Request Codex review
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const marker = '<!-- forgeops-codex-review -->';
            const body = [
              marker,
              '@codex review',
              '',
              `Requested automatically for commit ${context.payload.pull_request.head.sha}.`,
              '',
              'If this PR is not connected to Codex review yet, keep this workflow green and finish with human review.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
